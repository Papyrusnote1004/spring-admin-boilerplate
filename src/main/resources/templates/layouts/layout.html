<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - Admin' : 'Admin'}">Admin</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>

<!-- ── 모바일 상단 바 ─────────────────────────────────────────── -->
<nav class="navbar d-md-none mobile-topbar">
    <div class="container-fluid">
        <button class="btn btn-outline-light btn-sm" id="sidebarToggle">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="text-white fw-bold">Admin</span>
        <span></span>
    </div>
</nav>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="container-fluid">
    <div class="row g-0">

        <!-- ── 사이드바 ───────────────────────────────────────── -->
        <nav class="col-auto sidebar" id="sidebar">
            <div class="position-sticky pt-3">
                <div class="sidebar-brand text-center">
                    <a th:href="@{/dashboard}">🛠 Admin</a>
                    <small class="sidebar-brand__tagline d-block mt-1">Spring Boilerplate</small>
                </div>

                <!-- 운영 -->
                <button class="nav-group-toggle" data-bs-toggle="collapse"
                        data-bs-target="#grp-ops" aria-expanded="true" data-grp="ops">
                    <span>운영</span>
                    <i class="bi bi-chevron-down toggle-chevron"></i>
                </button>
                <div class="collapse show" id="grp-ops">
                    <ul class="nav flex-column pb-1">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/dashboard}">
                                <i class="bi bi-house-door"></i> 대시보드
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/posts}">
                                <i class="bi bi-file-earmark-text"></i> 게시글
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/notices}">
                                <i class="bi bi-file-earmark-text"></i> 공지사항
                            </a>
                        </li>
                    </ul>
                </div>

                <!-- 관리자 전용 -->
                <span th:if="${isAdmin}">
                <hr class="nav-divider">
                <button class="nav-group-toggle" data-bs-toggle="collapse"
                        data-bs-target="#grp-admin" aria-expanded="true" data-grp="admin">
                    <span>시스템</span>
                    <i class="bi bi-chevron-down toggle-chevron"></i>
                </button>
                <div class="collapse show" id="grp-admin">
                    <ul class="nav flex-column pb-1">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/admin/users}">
                                <i class="bi bi-people"></i> 사용자 관리
                            </a>
                        </li>
                    </ul>
                </div>
                </span>

                <hr class="nav-divider mt-2">
                <ul class="nav flex-column pb-2">
                    <li class="nav-item">
                        <a class="nav-link nav-logout" th:href="@{/logout}">
                            <i class="bi bi-box-arrow-right"></i> 로그아웃
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- ── 메인 콘텐츠 ─────────────────────────────────────── -->
        <main class="col main-content px-4">

            <!-- 상단 툴바 -->
            <div class="page-toolbar">
                <div class="page-toolbar__user">
                    <i class="bi bi-person-circle"></i>
                    <span class="page-toolbar__user-name"
                          th:text="${currentUser != null ? currentUser.name : '게스트'}">사용자</span>
                    <span class="text-muted small" th:if="${currentUserRole != null}"
                          th:text="'· ' + ${currentUserRole}">· ROLE</span>
                </div>
            </div>

            <!-- Flash 메시지 -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${warning}" class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${warning}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                <i class="bi bi-x-circle me-1"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 페이지 콘텐츠 삽입 지점 -->
            <div layout:fragment="content">
                <!-- content goes here -->
            </div>
        </main>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- 공통 JS: 사이드바 토글 & 활성 메뉴 -->
<script>
(function () {
    // 모바일 사이드바 토글
    var toggle  = document.getElementById('sidebarToggle');
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebarOverlay');
    if (toggle) toggle.addEventListener('click', function () {
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
    });
    if (overlay) overlay.addEventListener('click', function () {
        sidebar.classList.remove('show');
        overlay.classList.remove('show');
    });

    // 현재 경로 기반 활성 메뉴
    var path = window.location.pathname;
    document.querySelectorAll('.sidebar .nav-link[href]').forEach(function (link) {
        var href = link.getAttribute('href');
        if (!href || href === '#') return;
        if (href === '/dashboard') {
            if (path === '/' || path === '/dashboard') link.classList.add('active');
        } else if (path === href || path.startsWith(href + '/') || path.startsWith(href + '?')) {
            link.classList.add('active');
        }
    });

    // 그룹 접힘 상태 저장·복원
    var STORE_KEY = 'sidebar_grp';
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) {}

    document.querySelectorAll('[data-grp]').forEach(function (btn) {
        var grp    = btn.dataset.grp;
        var target = document.querySelector(btn.dataset.bsTarget);
        if (!target) return;
        if (target.querySelector('.nav-link.active')) return; // 활성 항목은 항상 열기
        if (saved[grp] === false) {
            target.classList.remove('show');
            btn.classList.add('collapsed');
            btn.setAttribute('aria-expanded', 'false');
        }
        btn.addEventListener('click', function () {
            try {
                var cur = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
                cur[grp] = btn.getAttribute('aria-expanded') !== 'true';
                localStorage.setItem(STORE_KEY, JSON.stringify(cur));
            } catch (e) {}
        });
    });
}());
</script>

<!-- 페이지별 스크립트 삽입 지점 -->
<div layout:fragment="scripts"></div>
</body>
</html>
