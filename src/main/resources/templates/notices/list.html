<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>게시글 목록 - Admin</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="h2 mb-0">게시글</h1>
                    <p class="mb-0">게시글을 관리합니다.</p>
                </div>
                <div class="col-auto">
                    <a th:href="@{/posts/new}" class="btn btn-primary">
                        <i class="bi bi-plus"></i> 새 게시글
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <!-- 검색 -->
        <div class="card mb-4 fade-in">
            <div class="card-body">
                <form method="get" th:action="@{/posts}" class="row g-2 align-items-end">
                    <div class="col-md-6">
                        <label for="keyword" class="form-label">검색</label>
                        <input type="text" class="form-control" id="keyword" name="keyword"
                               th:value="${keyword}" placeholder="제목 또는 내용으로 검색">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-search"></i> 검색
                        </button>
                        <a th:href="@{/posts}" class="btn btn-outline-secondary ms-1">초기화</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- 목록 -->
        <div class="card fade-in">
            <div class="card-header">
                <h5 class="mb-0 text-primary">
                    <i class="bi bi-list-ul me-2"></i>게시글 목록
                    <span class="badge bg-primary ms-1" th:text="${posts.totalElements}">0</span>
                </h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th width="60">번호</th>
                                <th>제목</th>
                                <th width="120">작성자</th>
                                <th width="60">조회</th>
                                <th width="130">등록일</th>
                                <th width="100">관리</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="post, stat : ${posts.content}">
                                <td th:text="${posts.totalElements - (posts.number * posts.size) - stat.index}">1</td>
                                <td>
                                    <a th:href="@{/posts/{id}(id=${post.id})}"
                                       class="text-decoration-none fw-semibold"
                                       th:text="${post.title}">제목</a>
                                </td>
                                <td th:text="${post.author != null ? post.author.name : '-'}">-</td>
                                <td th:text="${post.viewCount}">0</td>
                                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">-</td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/posts/{id}/edit(id=${post.id})}"
                                           class="btn btn-outline-secondary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button" class="btn btn-outline-danger"
                                                th:attr="data-id=${post.id}"
                                                onclick="deletePost(this.getAttribute('data-id'))">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${posts.content.size() == 0}">
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox display-5 d-block mb-2"></i>
                                    등록된 게시글이 없습니다.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 페이지네이션 -->
        <nav aria-label="페이지" class="mt-4" th:if="${posts.totalPages > 1}"
             th:with="startPage=${posts.totalPages <= 5 ? 0 : (posts.number < 3 ? 0 : (posts.number > posts.totalPages - 4 ? posts.totalPages - 5 : posts.number - 2))},
                      endPage=${posts.totalPages <= 5 ? posts.totalPages - 1 : (posts.number < 3 ? 4 : (posts.number > posts.totalPages - 4 ? posts.totalPages - 1 : posts.number + 2))}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${!posts.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/posts(page=${posts.number - 1}, keyword=${keyword})}">이전</a>
                </li>
                <li th:each="p : ${#numbers.sequence(startPage, endPage)}"
                    class="page-item" th:classappend="${p == posts.number} ? 'active'">
                    <a class="page-link" th:href="@{/posts(page=${p}, keyword=${keyword})}"
                       th:text="${p + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${!posts.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/posts(page=${posts.number + 1}, keyword=${keyword})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<div layout:fragment="scripts">
<script>
function deletePost(id) {
    if (!confirm('이 게시글을 삭제하시겠습니까?')) return;
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/posts/' + id + '/delete';
    document.body.appendChild(form);
    form.submit();
}
</script>
</div>
</body>
</html>
