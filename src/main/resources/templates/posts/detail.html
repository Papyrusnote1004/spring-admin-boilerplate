<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>게시글 상세 - Admin</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="h2 mb-0" th:text="${post.title}">제목</h1>
                    <p class="mb-0 text-muted small">
                        <span th:text="${post.author != null ? post.author.name : '-'}">작성자</span>
                        &nbsp;·&nbsp;
                        <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
                        &nbsp;·&nbsp; 조회 <span th:text="${post.viewCount}">0</span>
                    </p>
                </div>
                <div class="col-auto d-flex gap-2">
                    <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-outline-secondary">
                        <i class="bi bi-pencil"></i> 수정
                    </a>
                    <button type="button" class="btn btn-outline-danger"
                            th:attr="data-id=${post.id}"
                            onclick="deletePost(this.getAttribute('data-id'))">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                    <a th:href="@{/posts}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 목록
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="card fade-in">
            <div class="card-body" style="min-height: 200px; white-space: pre-wrap;"
                 th:text="${post.content}">내용</div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
<script>
function deletePost(id) {
    if (!confirm('이 게시글을 삭제하시겠습니까?')) return;
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/posts/' + id + '/delete';
    document.body.appendChild(form);
    form.submit();
}
</script>
</div>
</body>
</html>
