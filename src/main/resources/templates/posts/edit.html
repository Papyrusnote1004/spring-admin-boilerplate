<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>게시글 수정 - Admin</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <h1 class="h2 mb-0">게시글 수정</h1>
                </div>
                <div class="col-auto">
                    <a th:href="@{/posts/{id}(id=${post.id})}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> 상세로
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="card fade-in">
            <div class="card-body">
                <form th:action="@{/posts/{id}(id=${post.id})}" method="post" th:object="${post}">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" th:field="*{title}"
                               placeholder="제목을 입력하세요" required>
                    </div>
                    <div class="mb-4">
                        <label for="content" class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="content" th:field="*{content}"
                                  rows="12" placeholder="내용을 입력하세요" required></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> 저장
                        </button>
                        <a th:href="@{/posts/{id}(id=${post.id})}" class="btn btn-outline-secondary">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
