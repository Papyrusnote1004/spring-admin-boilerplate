<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>대시보드 - Admin</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div class="container-fluid">
            <h1 class="h2 mb-0">대시보드</h1>
            <p class="mb-0">환영합니다, <span th:text="${currentUser != null ? currentUser.name : '게스트'}">사용자</span>님</p>
        </div>
    </div>

    <div class="container-fluid">

        <!-- 요약 카드 -->
        <div class="row g-4 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="stat-card fade-in">
                    <div class="stat-card__icon" style="background:#e8eeff">
                        <i class="bi bi-file-earmark-text" style="color:#4361ee"></i>
                    </div>
                    <div>
                        <div class="stat-card__value" th:text="${totalPosts}">0</div>
                        <div class="stat-card__label">전체 게시글</div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3" th:if="${isAdmin}">
                <div class="stat-card fade-in">
                    <div class="stat-card__icon" style="background:#e8fff0">
                        <i class="bi bi-people" style="color:#1cb96e"></i>
                    </div>
                    <div>
                        <div class="stat-card__value" th:text="${totalUsers}">0</div>
                        <div class="stat-card__label">전체 사용자</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 최근 게시글 -->
        <div class="card fade-in">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-primary">
                    <i class="bi bi-clock-history me-2"></i>최근 게시글
                </h5>
                <a th:href="@{/posts}" class="btn btn-sm btn-outline-primary">전체 보기</a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>제목</th>
                                <th width="120">작성자</th>
                                <th width="60">조회</th>
                                <th width="130">등록일</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="post : ${recentPosts}">
                                <td>
                                    <a th:href="@{/posts/{id}(id=${post.id})}"
                                       class="text-decoration-none fw-semibold"
                                       th:text="${post.title}">제목</a>
                                </td>
                                <td th:text="${post.author != null ? post.author.name : '-'}">-</td>
                                <td th:text="${post.viewCount}">0</td>
                                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">-</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentPosts)}">
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <i class="bi bi-inbox display-5 d-block mb-2"></i>
                                    등록된 게시글이 없습니다.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
